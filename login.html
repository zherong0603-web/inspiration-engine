<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>灵感引擎 - 内测邀请</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, 'PingFang SC', system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 flex items-center justify-center min-h-screen p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 mb-2">灵感引擎</h1>
      <p class="text-sm text-gray-500">AI驱动的新媒体内容创作工具</p>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-8">
      <div class="mb-6">
        <div class="inline-block px-3 py-1 bg-blue-50 text-blue-700 text-xs font-medium rounded-full mb-4">首批内测版</div>
        <p class="text-sm text-gray-600 leading-relaxed">当前为首批内测版，请输入邀请码进入专属工作区</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">邀请码</label>
          <input type="text" id="invite-code-input" placeholder="请输入邀请码，如：BETA-A01"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all uppercase"
            autocomplete="off" />
        </div>
        <button onclick="handleLogin()"
          class="w-full bg-gray-900 text-white font-medium rounded-lg px-4 py-3 hover:bg-gray-800 transition-colors">
          进入工作区
        </button>
        <div id="error-msg" class="hidden text-sm text-red-600 text-center"></div>
      </div>

      <div class="mt-6 pt-6 border-t border-gray-100 text-center">
        <p class="text-xs text-gray-400">没有邀请码？请联系 zherong0603@gmail.com 获取内测资格</p>
      </div>
    </div>
  </div>

  <script src="invites.js"></script>
  <script>
    // 数据迁移：旧 key 'inviteCodes' → 新 key 'linggan_invites'
    (function migrateOldData() {
      const oldKey = 'inviteCodes';
      const newKey = 'linggan_invites';
      const hasNew = localStorage.getItem(newKey);
      const hasOld = localStorage.getItem(oldKey);
      if (!hasNew && hasOld) {
        localStorage.setItem(newKey, hasOld);
        localStorage.removeItem(oldKey);
      } else if (hasOld) {
        localStorage.removeItem(oldKey);
      }
    })();

    const input = document.getElementById('invite-code-input');
    const errorMsg = document.getElementById('error-msg');

    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    function handleLogin() {
      const code = input.value.trim().toUpperCase();
      if (!code) {
        showError('请输入邀请码');
        return;
      }

      const result = validateInviteCode(code);
      if (!result.valid) {
        showError(result.error || '邀请码无效，请联系我获取内测资格');
        return;
      }

      // 保存工作区信息
      localStorage.setItem('currentWorkspace', JSON.stringify({
        inviteCode: result.data.inviteCode,
        userId: result.data.userId,
        workspaceId: result.data.workspaceId,
        loginAt: new Date().toISOString()
      }));

      // 跳转到主应用
      window.location.href = 'index.html';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
      setTimeout(() => errorMsg.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
